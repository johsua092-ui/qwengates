# Nixpacks configuration for Railway deployment
# Bun as primary runtime, Node.js as secondary for wreq worker

[phases.setup]
nixPkgs = ["bun", "nodejs", "chromium", "nss", "freetype", "harfbuzz"]

[phases.install]
cmds = ["bun install"]

[phases.build]
cmds = ["bun run build", "mkdir -p dist/worker && cp src/worker/*.mjs dist/worker/ || true"]

[start]
cmd = "bun run start:prod"
